<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maestro AY Studio</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #000; color: #fff; min-height: 100vh; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { font-size: 24px; margin-bottom: 30px; }
        .section { margin: 20px 0; }
        .dropzone { border: 2px dashed #333; padding: 40px; text-align: center; cursor: pointer; margin-bottom: 20px; }
        .dropzone input { display: none; }
        .btn { background: #fff; color: #000; border: none; padding: 12px 24px; font-size: 14px; cursor: pointer; margin: 5px; }
        .btn:disabled { opacity: 0.3; }
        .player { display: flex; gap: 10px; align-items: center; margin: 20px 0; }
        .progress { flex: 1; }
        .progress input { width: 100%; }
        .code { background: #111; padding: 15px; font-family: monospace; font-size: 12px; white-space: pre-wrap; word-break: break-all; max-height: 300px; overflow: auto; }
        footer { margin-top: 40px; text-align: center; color: #666; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Maestro AY Studio</h1>
        
        <div class="dropzone" id="midi-dropzone">
            <p>Carregar arquivo MIDI</p>
            <input type="file" id="midi-input" accept=".mid,.midi">
        </div>
        
        <div id="meta"></div>
        
        <div class="section">
            <button id="btn-convert" class="btn" disabled>Converter</button>
            <button id="btn-download" class="btn" style="display:none">Download .AY</button>
        </div>
        
        <input type="text" id="cfg-title" value="Music" style="display:none">
        <input type="range" id="cfg-voices" min="1" max="16" value="4" style="display:none">
        
        <div class="player">
            <button id="btn-play-midi" class="btn" disabled>▶ MIDI</button>
            <button id="btn-play-ay" class="btn" disabled>▶ AY</button>
            <button id="btn-play-ai" class="btn" disabled>▶ AI</button>
            <button id="btn-stop" class="btn">■</button>
            <div class="progress">
                <input type="range" id="play-progress" min="0" max="100" value="0">
            </div>
        </div>
        
        <div class="section">
            <h3 style="margin-bottom:10px">Código .AY</h3>
            <button id="btn-copy-code" class="btn" style="font-size:12px;padding:5px 10px">Copiar</button>
            <div class="code" id="ay-code-output">Aguardando arquivo...</div>
        </div>
        
        <footer>Maestro AY Studio © 2026</footer>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/webmscore/webmscore.js"></script>
    <script src="dashboard.js"></script>
    <script src="synth.js"></script>
</body>
</html>
